services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartcar
      POSTGRES_PASSWORD: smartcar
      POSTGRES_DB: smartcar
    ports:
      - "5432:5432"
    volumes:
      - smartcar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcar -d smartcar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartcar_pgdata:
